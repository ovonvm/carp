name: pages

# Renders README.md as the project homepage on GitHub Pages.
# Repository Settings -> Pages must use "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Render markdown
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          mkdir -p _site
          pandoc README.md -s --metadata title="Carp" --metadata lang="zh-CN" -c style.css -o _site/index.html
          pandoc CHANGELOG.md -s --metadata title="更新记录" --metadata lang="zh-CN" -c style.css -o _site/changelog.html
          cat > _site/style.css <<'CSS'
          :root { color-scheme: light; }
          body { max-width: 860px; margin: 40px auto; padding: 0 20px 60px;
                 font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif;
                 color: #33261a; background: #fffaf0; }
          h1 { font-size: 2rem; margin: 0 0 1rem; }
          h2 { margin-top: 2.2rem; border-bottom: 1px solid #eadfce; padding-bottom: .35rem; }
          h3 { margin-top: 1.6rem; }
          a { color: #b4521f; }
          code { background: #f6ecd9; padding: .15em .35em; border-radius: 4px; font-size: .92em; }
          pre { background: #2b2117; color: #f6ead7; padding: 16px; border-radius: 10px; overflow-x: auto; }
          pre code { background: none; padding: 0; color: inherit; }
          table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
          th, td { border: 1px solid #e3d6c2; padding: 8px 10px; text-align: left; vertical-align: top; }
          th { background: #f8edda; }
          blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 4px solid #e7b98d; background: #fff4e3; }
          CSS

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
