# Carp nginx 反代样例。
# 要点：
#   - 只反代根路径（前端资源是绝对 /assets/...）
#   - 保留 Host 头（用 $http_host，CSRF 同源只比 Host；$host 会丢端口）
#   - client_max_body_size 放开到平台允许的单个请求大小
#   - 不要给上传/下载关闭代理缓冲，也不要强行指定 proxy_http_version
#   - TLS 在此终止；应用启动用 -cookie-secure always
#
# 实测（M6.6，32 MiB 分片）：给上传路径设置
# proxy_request_buffering off / proxy_buffering off / proxy_http_version 1.1
# 会把上传速度压到 ~1 MB/s；去掉这些设置、保持 nginx 默认（先缓冲再转发）后
# 速度恢复正常。因此下面只保留最少的必要指令。
#
# 启用：
#   sudo cp scripts/nginx-carp.conf /etc/nginx/sites-available/carp.conf
#   sudo ln -s /etc/nginx/sites-available/carp.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name carp.example.com;
    # 内网可先不跳 HTTPS；上证书后取消下一行注释
    # return 301 https://$host$request_uri;

    client_max_body_size 8g;

    location / {
        proxy_pass http://127.0.0.1:50011;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

